# Serves the built app inside the container. The server's own Nginx (port 80) forwards
# everything except /api/ and /health here, so this file needs no API proxy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # index.html is checked on every visit, so a new deploy shows up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Built assets carry a content hash in their name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
